<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School RFID Attendance V3</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background-color: #f0f2f5;
}
.container {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}
h1, h2 { text-align: center; color: #2c3e50; }

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border-radius: 6px;
    border: 2px solid #e1e4e8;
    font-size: 16px;
}
button {
    background: #4CAF50;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #45a049; }

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}
th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}
th {
    background: #4CAF50;
    color: white;
}

.profile-pic {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
}
.no-pic {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
}

.admin-box {
    border: 2px dashed #ccc;
    background: #f8fafc;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
@media(max-width:600px){
    .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">
<h1>🏫 Daily Attendance Check-in</h1>
<input type="text" id="attendanceInput" placeholder="Scan RFID tag here..." autofocus>
<div id="status"></div>

<table>
<thead>
<tr>
<th>Photo</th>
<th>Time</th>
<th>Name</th>
<th>Grade</th>
<th>Gender</th>
<th>ID</th>
</tr>
</thead>
<tbody id="attendanceBody"></tbody>
</table>
</div>

<div class="container admin-box">
<h2>➕ Register New Student</h2>

<div class="form-grid">
<input type="text" id="regName" placeholder="Full Name">
<select id="regGrade">
<option disabled selected>Select Grade</option>
<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Teacher</option>
</select>

<select id="regGender">
<option disabled selected>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<input type="file" id="regPhoto" accept="image/*">
<input type="text" id="regTag" placeholder="Scan card to register">
<button onclick="registerStudent()">Save Student</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, setDoc, doc,
onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAy4GmZcNGPCjyshvaQaCr47xpMfomT9YM",
authDomain: "my-rfid-attendance-5da0f.firebaseapp.com",
projectId: "my-rfid-attendance-5da0f",
storageBucket: "my-rfid-attendance-5da0f.firebasestorage.app",
messagingSenderId: "667070321406",
appId: "1:667070321406:web:a5f5ddf061a548fe46cbaf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const toBase64 = file => new Promise((res, rej) => {
const r = new FileReader();
r.onload = () => res(r.result);
r.onerror = e => rej(e);
r.readAsDataURL(file);
});

let studentDirectory = {};

onSnapshot(collection(db, "students"), snap => {
snap.forEach(d => {
const s = d.data();
studentDirectory[d.id] = {
name: s.name,
grade: s.grade,
gender: s.gender,
photo: s.photo || null
};
});
});

window.registerStudent = async () => {
const name = regName.value.trim();
const grade = regGrade.value;
const gender = regGender.value;
const tag = regTag.value.trim();
const photoFile = regPhoto.files[0];

if (!name || !grade || !gender || !tag) {
alert("Fill all fields");
return;
}

let photo = null;
if (photoFile) photo = await toBase64(photoFile);

await setDoc(doc(db, "students", tag), {
name, grade, gender, photo,
registeredAt: serverTimestamp()
});

regName.value = regGrade.value = regGender.value = regTag.value = "";
regPhoto.value = "";
alert("Student Registered");
};

attendanceInput.addEventListener("keypress", async e => {
if (e.key === "Enter") {
const id = attendanceInput.value.trim();
attendanceInput.value = "";
if (!id) return;

const s = studentDirectory[id];

await addDoc(collection(db, "attendance"), {
tag_id: id,
student_name: s?.name || "Unknown",
student_grade: s?.grade || "--",
student_gender: s?.gender || "--",
student_photo: s?.photo || null,
timestamp: serverTimestamp()
});
}
});

const q = query(collection(db, "attendance"), orderBy("timestamp", "desc"), limit(10));

onSnapshot(q, snap => {
attendanceBody.innerHTML = "";
snap.forEach(d => {
const a = d.data();
const time = a.timestamp ? a.timestamp.toDate().toLocaleTimeString() : "";
attendanceBody.innerHTML += `
<tr>
<td>${a.student_photo ? `<img src="${a.student_photo}" class="profile-pic">` : `<div class="no-pic">?</div>`}</td>
<td>${time}</td>
<td>${a.student_name}</td>
<td>${a.student_grade}</td>
<td>${a.student_gender}</td>
<td>${a.tag_id}</td>
</tr>`;
});
});
</script>

</body>
</html>
