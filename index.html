<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School RFID Attendance V3</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background-color: #f0f2f5;
}

.container {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

h1, h2 {
    color: #2c3e50;
    text-align: center;
    margin-bottom: 1.5rem;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: 2px solid #e1e4e8;
    border-radius: 6px;
    font-size: 16px;
}

input:focus, select:focus {
    border-color: #4CAF50;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background:#45a049; }

#status {
    margin-top: 1rem;
    padding: 12px;
    text-align: center;
    display: none;
    font-weight: bold;
    border-radius: 6px;
}

.success { background:#d4edda; color:#155724; }
.error { background:#f8d7da; color:#721c24; }

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}

th {
    background: #4CAF50;
    color: white;
}

.profile-pic {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.no-pic {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
}

.admin-box {
    border: 2px dashed #cbd5e0;
    background: #f8fafc;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

@media(max-width:600px){
    .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">
    <h1>🏫 Daily Attendance Check-in</h1>
    <p style="text-align:center;color:#666;">Scan your RFID card</p>
    <input type="text" id="attendanceInput" placeholder="Scan RFID tag..." autofocus>

    <div id="status"></div>

    <h3>🕒 Live Attendance</h3>
    <table>
        <thead>
            <tr>
                <th>Photo</th>
                <th>Time</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Grade</th>
                <th>ID</th>
            </tr>
        </thead>
        <tbody id="attendanceBody"></tbody>
    </table>
</div>

<div class="container admin-box">
    <h2>➕ Register Student</h2>

    <div class="form-grid">
        <input id="regName" placeholder="Full Name">

        <select id="regGender">
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <select id="regGrade">
            <option value="" disabled selected>Select Grade</option>
            <option>Grade 1</option>
            <option>Grade 2</option>
            <option>Grade 3</option>
            <option>Grade 4</option>
            <option>Grade 5</option>
            <option>Grade 6</option>
            <option>Teacher</option>
        </select>
    </div>

    <input type="file" id="regPhoto" accept="image/*">
    <input id="regTag" placeholder="Scan RFID to Register">
    <button onclick="registerStudent()">Save Student</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAy4GmZcNGPCjyshvaQaCr47xpMfomT9YM",
  authDomain: "my-rfid-attendance-5da0f.firebaseapp.com",
  projectId: "my-rfid-attendance-5da0f",
  storageBucket: "my-rfid-attendance-5da0f.appspot.com",
  messagingSenderId: "667070321406",
  appId: "1:667070321406:web:a5f5ddf061a548fe46cbaf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------- Helpers ---------- */
const toBase64 = file => new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
});

/* ---------- Student Directory ---------- */
let students = {};

onSnapshot(collection(db,"students"), snap=>{
    snap.forEach(d=>{
        students[d.id] = d.data();
    });
});

/* ---------- Register ---------- */
window.registerStudent = async ()=>{
    const name = regName.value.trim();
    const gender = regGender.value;
    const grade = regGrade.value;
    const tag = regTag.value.trim();
    const photoFile = regPhoto.files[0];

    if(!name || !gender || !grade || !tag){
        alert("Fill all fields");
        return;
    }

    let photo = null;
    if(photoFile) photo = await toBase64(photoFile);

    await setDoc(doc(db,"students",tag),{
        name, gender, grade, photo,
        registeredAt: serverTimestamp()
    });

    alert("Student Registered ✅");
    regName.value = regGender.value = regGrade.value = regTag.value = "";
    regPhoto.value = "";
};

/* ---------- Attendance ---------- */
attendanceInput.addEventListener("keypress", async e=>{
    if(e.key==="Enter"){
        const id = attendanceInput.value.trim();
        attendanceInput.value="";
        if(!id) return;

        const s = students[id];

        await addDoc(collection(db,"attendance"),{
            tag_id:id,
            student_name: s?.name || "Unknown",
            student_gender: s?.gender || "N/A",
            student_grade: s?.grade || "N/A",
            student_photo: s?.photo || null,
            timestamp: serverTimestamp()
        });

        showStatus(s ? `Welcome ${s.name}` : "Unregistered Tag", s ? "success":"error");
    }
});

function showStatus(msg,type){
    status.textContent=msg;
    status.className=type;
    status.style.display="block";
    setTimeout(()=>status.style.display="none",2500);
}

/* ---------- Live Table ---------- */
const q = query(collection(db,"attendance"),orderBy("timestamp","desc"),limit(10));
onSnapshot(q,snap=>{
    attendanceBody.innerHTML="";
    snap.forEach(d=>{
        const x=d.data();
        const time=x.timestamp?.toDate().toLocaleTimeString()||"Now";
        attendanceBody.innerHTML+=`
        <tr>
            <td>${x.student_photo ? `<img src="${x.student_photo}" class="profile-pic">` : `<div class="no-pic">?</div>`}</td>
            <td>${time}</td>
            <td><b>${x.student_name}</b></td>
            <td>${x.student_gender}</td>
            <td>${x.student_grade}</td>
            <td>${x.tag_id}</td>
        </tr>`;
    });
});
</script>

</body>
</html>
